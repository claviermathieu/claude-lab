name: claude-review

# Revue automatique de chaque PR avec la config du repo (.claude/ : skills, subagent model-validator).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }} — PR #${{ github.event.pull_request.number }}
            Relis les changements de cette PR par rapport à ${{ github.base_ref }}.
            - Pour tout livrable actuariel (calcul SCR, ECL, courbes, QRT), appuie-toi sur les skills
              du repo et délègue la relecture au subagent model-validator.
            - Lance `uv run pytest -q` et signale les échecs.
            - Publie un seul commentaire de synthèse sur la PR (verdict, constats bloquants/majeurs,
              tests), et des commentaires en ligne uniquement pour les constats bloquants.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Agent,Skill,Bash(uv run pytest:*),Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
